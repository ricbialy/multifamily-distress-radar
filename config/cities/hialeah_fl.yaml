slug: hialeah_fl
name: City of Hialeah
state: FL
enabled: true
notes: >-
  Hialeah's official Tyler CSS source and Miami-Dade's authoritative Property
  Point View layer were live-verified on 2026-07-17.
source:
  name: hialeah_tyler_energov
  adapter: tyler_energov
  base_url: https://hialeahfl-energovpub.tylerhost.net/apps/selfservice
  public_search_url: https://hialeahfl-energovpub.tylerhost.net/apps/selfservice
  record_url_template: https://hialeahfl-energovpub.tylerhost.net/apps/selfservice#/code/{record_id}
  page_size: 1000
  request_delay_seconds: 0.25
  timeout_seconds: 45
  max_retries: 3
  active_statuses:
    - Admin Review
    - Assigned
    - Continuance
    - Intent to Lien Sent
    - ITL Appealed
    - ITL NOH Sent
    - Lien
    - Notice of Hearing Sent
    - Notice of Violation
    - Notice of Violation Extension
    - Notice Of Violation Sent
    - Pending Payment
    - Re-Inspection
    - Refer to Special Master
    - Special Master Extension
    - Special Master Order Sent
    - Violation Appealed
    - Warning Extension
    - Warning Issued
    - Warning Sent
property_source:
  name: miami_dade_property_point_view
  adapter: arcgis_property
  layer_url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/PaGISView_gdb/FeatureServer/0
  dataset_url: https://gis-mdc.opendata.arcgis.com/datasets/MDC::property-point-view/about
  municipality: HIALEAH
  min_units: 10
  max_units: 80
  dor_codes:
    - "0303"
  page_size: 2000
  request_delay_seconds: 0.25
  timeout_seconds: 60
  max_retries: 3
official_records_source:
  name: miami_dade_clerk_official_records
  adapter: miami_dade_clerk_api
  base_url: https://www2.miamidadeclerk.gov/Developers/api/OfficialRecords
  documentation_url: https://www2.miamidadeclerk.gov/Developers/Help/Api/GET-api-OfficialRecords_parameter1_parameter2_authKey
  auth_key_env: MIAMI_DADE_CLERK_AUTH_KEY
  enabled: true
  request_delay_seconds: 0.25
  timeout_seconds: 45
  max_retries: 3
  notes: Requires an enabled Clerk developer account with purchased API units.
